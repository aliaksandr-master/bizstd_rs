[package]
name = "bizstd-binary"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The compiled half of the bizstd Python package. Not useful on its own."
repository = "https://github.com/aliaksandr-master/bizstd_rs"
publish = false

[lib]
# The extension module the Python package imports. It is `_native` and not
# `bizstd_binary` because the package around it is a real Python package: that
# is what gives `py.typed` and the stubs somewhere to live.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bizstd = { path = "../../rust", version = "2.1" }

# abi3 from 3.9: one wheel per platform covers every Python from there on,
# instead of one per platform per minor version. The cost is that the newest
# CPython APIs are off limits, which this binding does not reach for.
pyo3 = { version = "0.27", features = ["abi3-py39", "extension-module"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
