[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizstd"
version = "2.0.0"
description = "An append-only container for records that arrive continuously and are read back in bulk."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Aliaksandr Master", email = "alxe.master@gmail.com" }]
keywords = ["zstd", "compression", "append-only", "container", "file-format"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]
# The compiled half, pinned to the same major and minor. Only the patch may
# differ between them, which is what lets a fix ship on one side alone.
dependencies = ["bizstd-binary>=2.0,<2.1"]

[project.urls]
Homepage = "https://github.com/aliaksandr-master/bizstd_rs"
Source = "https://github.com/aliaksandr-master/bizstd_rs"
Changelog = "https://github.com/aliaksandr-master/bizstd_rs/blob/main/CHANGELOG.md"
Benchmarks = "https://github.com/aliaksandr-master/bizstd_rs/tree/main/benchmarks"

[tool.hatch.build.targets.wheel]
packages = ["src/bizstd"]
