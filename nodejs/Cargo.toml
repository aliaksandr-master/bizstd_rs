[package]
name = "bizstd-node"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Node.js binding for the bizstd container format."
repository = "https://github.com/aliaksandr-master/bizstd_rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bizstd = { path = "../rust", version = "2.0" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
